name: Release

# Builds the Windows installer and portable exe on a Windows runner, with the
# toolchain the app ships with (MSVC for the UI Automation helper), and
# publishes them as the GitHub release for the version in package.json.
#
# Start it from the Actions tab (Release > Run workflow, on main), or push a
# tag vX.Y.Z that matches package.json. The tag is created at the commit built
# when it does not exist yet. Running it again for a version that already has
# a release replaces that release's files.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - run: npm ci --no-audit --no-fund

      - name: Helper tests
        run: cargo test --release --manifest-path native/uia-helper/Cargo.toml

      # --publish never: electron-builder would otherwise try to publish on a
      # tag build; the release is made below, with the notes and checksums.
      - name: Build installer and portable exe
        run: npm run dist -- --publish never

      - name: Checksums
        shell: bash
        working-directory: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "ScreenMcpOverlay-Setup-$VERSION.exe" "ScreenMcpOverlay-Portable-$VERSION.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          files=(
            "release/ScreenMcpOverlay-Setup-$VERSION.exe"
            "release/ScreenMcpOverlay-Portable-$VERSION.exe"
            "release/SHA256SUMS.txt"
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            notes="docs/release-notes/$tag.md"
            args=(--title "Screen MCP Overlay $tag" --target "$GITHUB_SHA" --latest)
            if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi
