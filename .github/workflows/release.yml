name: Release

# Builds the Windows installer and portable exe on a Windows runner, with the
# toolchain the app ships with (MSVC for the UI Automation helper), and
# publishes them as the GitHub release for the version in package.json.
#
# Start it from the Actions tab (Release > Run workflow, on main), or push a
# tag vX.Y.Z that matches package.json. The tag is created at the commit built
# when it does not exist yet. Running it again for a version that already has
# a release replaces that release's files, but only from the commit its tag
# points at. Only the publish job holds a token that can write to the repo.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    # A release is made from main or from a vX.Y.Z tag, never from another branch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - run: npm ci --no-audit --no-fund

      - name: Helper tests
        run: cargo test --release --manifest-path native/uia-helper/Cargo.toml

      # --publish never: electron-builder would otherwise try to publish on a
      # tag build; the release is made below, with the notes and checksums.
      - name: Build installer and portable exe
        run: npm run dist -- --publish never

      # The helper must start on a PC without the Visual C++ redistributable,
      # which the installer does not ship (see .cargo/config.toml).
      - name: Helper needs no Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error 'dumpbin.exe not found'; exit 1 }
          $deps = & $dumpbin.FullName /nologo /dependents release\win-unpacked\resources\uia-helper.exe | Out-String
          Write-Output $deps
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') { Write-Error 'uia-helper.exe needs the Visual C++ runtime'; exit 1 }

      - name: Checksums
        shell: bash
        working-directory: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "ScreenMcpOverlay-Setup-$VERSION.exe" "ScreenMcpOverlay-Portable-$VERSION.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            release/ScreenMcpOverlay-Setup-${{ steps.version.outputs.version }}.exe
            release/ScreenMcpOverlay-Portable-${{ steps.version.outputs.version }}.exe
            release/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          files=(
            "release/ScreenMcpOverlay-Setup-$VERSION.exe"
            "release/ScreenMcpOverlay-Portable-$VERSION.exe"
            "release/SHA256SUMS.txt"
          )
          # The release holds the build of its tag's commit and nothing else.
          tag_sha=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag is at $tag_sha but this run built $GITHUB_SHA; bump the version, or delete that tag and its release first"
            exit 1
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            gh release upload "$tag" "${files[@]}" --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --latest
            fi
          else
            notes="docs/release-notes/$tag.md"
            args=(--title "Screen MCP Overlay $tag" --target "$GITHUB_SHA" --latest)
            if [[ -f "$notes" ]]; then
              args+=(--notes-file "$notes")
            else
              echo "::warning::no $notes, using generated notes"
              args+=(--generate-notes)
            fi
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi
