<!doctype html>
<meta charset="utf-8" />
<title>overlay</title>
<link rel="stylesheet" href="overlay.css" />
<canvas id="c"></canvas>
<div id="strip" role="dialog" aria-live="polite">
    <div id="strip-main">
        <span id="strip-dot"></span>
        <!-- The app's own questions only (StepView.fromApp): no agent's words can draw this. -->
        <span id="strip-app" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 2.6 3.2v4c0 3.3 2.2 6.2 5.4 7.6 3.2-1.4 5.4-4.3 5.4-7.6v-4L8 1.2Z"/><path class="tick" d="M5.5 8.2 7.2 9.9l3.3-3.6"/></svg>Screen MCP Overlay</span>
        <span id="strip-progress"></span>
        <span id="strip-text"></span>
        <span id="strip-time"></span>
    </div>
    <div id="strip-wait"></div>
    <div id="strip-actions">
        <span id="strip-buttons"></span>
        <span id="strip-hint"></span>
    </div>
</div>
<script src="overlay.js"></script>
